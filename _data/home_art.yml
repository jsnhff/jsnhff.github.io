# The home page's scratch plate and the pictures after it.
#
# `showing` is what the page uses, in order: the first is the picture the
# penny scratches open, the rest follow in the little show. Each fills the
# plate, cropped at its edges if need be; `fit: contain` shows the whole
# picture inside it instead.
#
# `wiki` is where the artist's name links to.
#
# `archive` is everything that has been up before. Its files stay in
# images/home, so bringing one back is moving its entry up into `showing`.

showing:
  - src: /images/home/throwing-three-balls.webp
    artist: John Baldessari
    wiki: https://en.wikipedia.org/wiki/John_Baldessari
    title: Throwing Three Balls in the Air (Best of 36 Attempts)
    year: 1973
  - src: /images/home/katabasis.webp
    artist: Paul Chan
    wiki: https://en.wikipedia.org/wiki/Paul_Chan_(artist)
    title: Katabasis
    year: 2019
  - src: /images/home/social-synthetic.webp
    artist: Seth Price
    wiki: https://en.wikipedia.org/wiki/Seth_Price
    title: Social Synthetic, installation view, Museum Brandhorst, Munich
    year: 2017-18

archive:
  - src: /images/home/palm.webp
    artist: John Baldessari
    wiki: https://en.wikipedia.org/wiki/John_Baldessari
    title: Palm tree / seascape
    year: 2010
  - src: /images/home/no-more-boring-art.webp
    artist: John Baldessari
    wiki: https://en.wikipedia.org/wiki/John_Baldessari
    title: I Will Not Make Any More Boring Art
    year: 1971
    fit: contain
