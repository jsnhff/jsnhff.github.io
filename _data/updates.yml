- date: '2025-12-01'
  type: Published
  body: 'American Psycho is featured in <a href="https://www.spectorbooks.com/book/library-of-artistic-print-on-demand">Library of Artistic Print on Demand: Post-Digital Publishing in Times of Platform Capitalism</a>, published by Spector Books (Leipzig) and edited by Annette Gilbert & Andreas Bülhoff. 720 pages.'
- date: '2024-11-01'
  type: Published
  body: 'American Psycho is included in <a href="https://mitpress.mit.edu/9780262549813/output/">Output: An Anthology of Computer-Generated Text, 1953–2023</a>, a landmark anthology published by MIT Press and Counterpath Press, edited by Lillian-Yvonne Bertram and Nick Montfort.'
- date: '2023-08-13'
  type: Talk
  body: Panel discussion at <a href="https://www.hauserwirth.com/news/42514-la-art-book-fair-returns-hauser-wirth-publishers-and-printed-matter-host-mornings-in-the-garden-in-downtown-los-angeles/" title="Mornings in the Garden">Mornings in the Garden</a>, LA Art Book Fair, discussing AI and bookmaking with <a href="https://adamlucas.info" target="_blank" rel="noopener">Adam Lucas</a>. Co-presented by Hauser & Wirth Publishers and Printed Matter.
- date: '2023-08-01'
  type: Published
  body: <a href="https://specificideas.com/autosummarize" title="AutoSummarize second edition">AutoSummarize</a> — A second edition published with Specific Ideas (Adam Swift Lucas), featuring a foreword by ChatGPT and a barcode by DALL·E. Launched at Printed Matter's LA Art Book Fair.
- date: '2022-02-01'
  type: Published
  body: 'AutoSummarize is included in <a href="https://www.uapress.ua.edu/9780817360412/conceptualisms/">Conceptualisms: The Anthology of Prose, Poetry, Visual, Found, E- & Hybrid Writing as Contemporary Art</a>, published by University of Alabama Press and edited by Stephen Tomasula.'
- date: '2020-12-15'
  type: Exhibition
  body: <a href="https://drive.google.com/file/d/1t1ShbmPK6W3cdEQv6jYK2JHF3KCY8ywH/view?usp=sharing" title="Atmosphere PDF link">Atmosphere</a>, "a speculative fiction exquisite corpse under shelter in place" organized by my friend <a href="http://www.eliavargas.com/writing" title="Elia Vargas' personal site">Elia Vargas</a>, and which I contributed to back in the spring, is on exhibition at <a href="https://accumulations.online/atmosphere.html" title="Accumulations" alt="Accumulations exhibition link">Accumulations</a> curated by Daniel Lichtman.
- date: '2020-06-01'
  type: Writing
  body: I contributed to <a href="https://drive.google.com/file/d/1t1ShbmPK6W3cdEQv6jYK2JHF3KCY8ywH/view?usp=sharing" title="Atmosphere PDF link">Atmosphere</a>, "a speculative fiction exquisite corpse under shelter in place" organized by my friend <a href="http://www.eliavargas.com/writing" title="Elia Vargas' personal site">Elia Vargas</a>. On March 16, 2020, at the beginning stages of the global pandemic and social distancing, he initiated an "experiment in thinking together from afar with friends, artists, writers, and educators across five continents." 42 people from across the planet participated and the final PDF was designed by <a href="http://www.nataliesims.com/" title="Natalie Sims personal site">Natalie Sims</a>. You can find my short piece in the PDF by searching for "new voice task."
- date: '2019-01-10'
  type: Writing
  body: I wrote a guide on <a href="https://thecreativeindependent.com/guides/how-to-make-a-website-for-your-creative-work/"> How to make a website for your creative work</a> for <a href="https://thecreativeindependent.com/">The Creative Independent</a>. It's purpose is to help creative folk get their work on the internet so they can share it with the wider world. Shout out to <a href="https://www.instagram.com/sean_suchara/?hl=en">Sean Suchara</a> for the illustrations. You can also find the post on <a href="https://www.fastcompany.com/90290257/how-to-make-a-website-for-your-creative-work">Fast Company</a>. Edited by <a href="https://willakoerner.com/" alt="Willa Koener is cool">Willa Köerner</a>.
- date: '2019-01-09'
  type: Exhibition
  body: I have new work included in a drive-in sound exhibition titled "Away Message" at <a href="http://www.sweetpasssculpturepark.com/awaymessage-lander.html">Sweet Pass Sculpture Park</a>. My piece will be broadcast alongside 45 international artists over a low-powered FM transmitter. It's live from January 10 - February 23, 2019. If you're driving through Dallas, tune in.
- date: '2017-05-02'
  type: Published
  body: My diagrams were published in <a href="http://www.livingroomlightexchange.com/">Living Room Light Exchange's</a> second publication <a href="http://www.livingroomlightexchange.com/publication/">State Change</a>. It's a collection of artists, friends, writing, and commissions focused on the technology and change. <a href="https://www.liatberdugo.com/">Liat Berdugo</a> and <a href="http://www.eliavargas.com/">Elia Vargas</a> edited the book with design by <a href="http://www.nataliesims.com/about-1/">Natalie Sims</a>.
- date: '2017-01-15'
  type: Collection
  body: American Psycho and AutoSummarize are now held in the <a href="https://www.moma.org/research/library">MoMA Library</a> at The Museum of Modern Art, New York, through its acquisition of the <a href="https://soulellis.com/entries/lotpw.html">Library of the Printed Web</a> — a collection of 244 items by 130 artists curated by Paul Soulellis.
- date: '2015-11-19'
  type: Performance
  body: I'm reading at <a href="http://babycastles.com/event/wordhack_xvii">Wordhack XVII</a> on Thursday, November 19th at <a href="http://babycastles.com/">Babycastles</a> — curated by <a href="https://twitter.com/clairedonato">Claire Donato</a>, feat. <a href="https://twitter.com/jonotraineb">Jonathan Basile</a>, Jim Brown & <a href="https://twitter.com/emptyrusso">Michael Russo</a>, <a href="https://twitter.com/flourish">Flourish Klink</a> and Me.
- date: '2015-10-08'
  type: Exhibition
  body: Five signed, limited edition copies of <a href="http://www.jason-huff.com/projects/autosummarize">AutoSummarize</a> will be exhibited at <a href="http://www.societe-d-electricite.com/" title="The Société">The Société</a> in <a href="https://www.google.com/maps/place/Rue+Vanderstichelen+106,+1080+Molenbeek-Saint-Jean,+Belgium/@50.8642482,4.3401968,3a,75y,229h,90t/data=!3m7!1e1!3m5!1spLUusF74SgfUEHY88sljKA!2e0!6s%2F%2Fgeo0.ggpht.com%2Fcbk%3Fcb_client%3Dmaps_sv.tactile%26output%3Dthumbnail%26thumb%3D2%26panoid%3DpLUusF74SgfUEHY88sljKA%26w%3D374%26h%3D75%26yaw%3D229%26pitch%3D0%26thumbfov%3D120%26ll%3D50.864248,4.340197!7i13312!8i6656!4m7!1m4!3m3!1s0x47c3c39477841fb9:0xb6b585165c9487d9!2sRue+Vanderstichelen+106,+1080+Molenbeek-Saint-Jean,+Belgium!3b1!3m1!1s0x47c3c39477841fb9:0xb6b585165c9487d9!6m1!1e1">Belgium</a> — opening October 8th, 2015.
- date: '2015-05-27'
  type: Exhibition
  body: An excerpt from <a href="http://work-life.tips" title="work-life.tips">work-life.tips</a> is appearing at the <a href="http://www.printscreenfestival.com/" title="Print Screen festival">Print Screen festival</a> in the <a href="https://www.facebook.com/pages/Maratoon-Holon-Cinematheque/309958785815375" title="Holon Cinematheque">Holon Cinematheque</a> in Tel Aviv, Israel on May 27th.
- date: '2015-05-18'
  type: Collection
  body: 'Some excerpts of my research for <a title="real-beauty.pics" href="/projects/real-beauty-pics/">real-beauty.pics</a> are included in <a title="Printed Web 3" href="http://libraryoftheprintedweb.tumblr.com/">Printed Web 3</a>, curated by <a href="http://soulellis.com/">Paul Soulellis</a>. You can read more about the third issue in Paul''s essay <a title="Poor Media on Demand: All the files of Printed Web 3" href="http://rhizome.org/editorial/2015/may/18/printed-web-3/">Poor Media on Demand: All the files of Printed Web 3</a> at <a title="Rhizome" href="http://rhizome.org">Rhizome</a>.'
- date: '2015-03-01'
  type: Panel
  body: 'I''m speaking on a panel titled <a title="Narrative Fragments" href="http://andnow2015a.sched.org/event/304c9fa564e5358b57b15998abd861dd" target="_blank">Narrative Fragments: Art, Language, and Algorithm</a> about <a title="American Psycho" href="/projects/american-psycho/" target="_blank">American Psycho</a> and new work with <a title="Mimi Cabell" href="http://mimicabell.com" target="_blank">Mimi Cabell</a>, <a title="Nicholas O''Brien" href="http://doubleunderscore.net" target="_blank">Nicholas O''Brien</a>, and <a title="Liat Berdugo" href="http://digikits.ch" target="_blank">Liat Berdugo</a> at <a href="http://andnow2015.com" title="&Now" target="_blank">&Now: Blast Radius</a> at CalArts in Santa Clarita, CA on March 27, 2015.'
- date: '2014-10-15'
  type: Book
  body: A few copies of <a title="American Psycho" href="/projects/american-psycho/" target="_blank">American Psycho</a> are available at the <a href="http://shop.yvon-lambert.com/" title="Yvon Lambert Bookshop">Yvon Lambert Bookshop</a> in Paris, FR this month. Get them while you can.
- date: '2014-09-06'
  type: Exhibition
  body: <a title="American Psycho" href="/projects/american-psycho/" target="_blank">American Psycho</a> is featured in <a href="https://franklinstreetworksdocuments.wordpress.com/2014/10/28/it-narratives-the-movement-of-objects-as-information-installation-photos-by-chad-kleitsch/" title="It Narratives">It Narratives</a>, an exhibition curated by <a href="http://tcour.com/" title="The one and only">Brian Droitcour</a> and <a href="http://post.at.moma.org/profiles/22-zanna-gilbert" title="Zanna Gilbert">Zanna Gilbert</a> about art, mail, and the internet on view at <a href="http://www.franklinstreetworks.org/" title="Franklin Street Works">Franklin Street Works</a> in Stamford, CT, from September 6th - November 9th, 2014
- date: '2014-08-30'
  type: Press
  body: <a title="American Psycho" href="/projects/american-psycho/" target="_blank">American Psycho</a> is featured in a write up on <a href="https://electricliterature.com/rewriting-through-google-ads-mimi-cabell-and-jason-huffs-american-psycho/" title="Electric Literature">Electric Lit</a>. Maru Pabón writes, "It’s a fascinating and unsettling object, a testament to the possibilities of combining digital aesthetics and the traditional book form."
- date: '2013-09-01'
  type: Artist Talk
  body: I’ll be giving an <a title="Artist talk at NMBAA" href="http://www.nbmaa.org/index.php?option=com_content&amp;task=view&amp;id=33&amp;Itemid=57" target="_blank">artist talk at the New Britain Museum of American Art</a> on Friday September 6th, 2013 at 6:00pm. I’ll be discussing <a title="The Road Not Taken" href="http://www.jason-huff.com/projects/the-road-not-taken/" target="_blank">The Road Not Taken</a> and a few other works.
- date: '2013-08-01'
  type: Exhibition
  body: <a title="The Road Not Taken" href="http://www.jason-huff.com/projects/the-road-not-taken/" target="_blank">The Road Not Taken</a> is in an <a title="Upcoming exhibition at NMBAA" href="http://www.nbmaa.org/index.php?option=com_content&amp;task=view&amp;id=33&amp;Itemid=57" target="_blank">upcoming exhibition at the New Britain Museum of American Art</a> in New Britain, CT. It runs from July 27 to December 8, 2013. Opening reception is Friday September 6th, 5:30pm to 8:00pm.
- date: '2013-06-30'
  type: Guest Juror
  body: I’m a <a title="Wassaic Jury Member" href="http://wassaicartistresidency.org/apply/meet-our-jury/" target="_blank">jury member</a> for the <a title="Wassaic Artist Residency" href="http://wassaicartistresidency.org/" target="_blank">Wassaic Artist Residency</a> this season. <a title="Wassaic Artist Residence" href="http://wassaicartistresidency.org/residents/" target="_blank">Check out their current residents</a>.
- date: '2013-04-12'
  type: Guest Critic
  body: I’m a guest critic at the <a title="Wassaic Artist Residency" href="http://wassaicartistresidency.org/" target="_blank">Wassaic Artist Residency</a> Saturday, April 13, 2013. <a title="Wassaic Artist Residence" href="http://wassaicartistresidency.org/residents/" target="_blank">Check out their current residents</a>.
- date: '2013-03-11'
  type: Published
  body: 'My essay, <a title="Beyond the Surface: 15 Years of Desktop Aesthetics" href="http://rhizome.org/editorial/2012/mar/14/beyond-surface-15-years-desktop-aesthetics/">Beyond the Surface: 15 Years of Desktop Aesthetics</a>, is included in <a title="Link Editions ''Best of Rhizome 2012''" href="http://www.linkartcenter.eu/archives/2426">Link Editions "Best of Rhizome 2012"</a> edited by <a title="Joanne McNeil" href="http://www.joannemcneil.com/">Joanne McNeil</a>.'
- date: '2012-09-01'
  type: Published
  body: <a href="/projects/american-psycho/" title="American Psycho">American Psycho</a> — A conceptual artist's book with Mimi Cabell published by Traumawien (Vienna). The entire text of Bret Easton Ellis's novel was sent through Gmail, collecting Google's contextual ads which became footnotes, with Ellis's text then erased. Now has its own <a href="https://en.wikipedia.org/wiki/American_Psycho_(conceptual_novel)">Wikipedia article</a>.
- date: '2012-04-08'
  type: Exhibition
  body: <a title="American Psycho" href="/projects/american-psycho/" target="_blank">American Psycho</a> is featured in the exhibition <a title="Erreur d'impression" href="https://jeudepaume.org/en/evenement/american-psycho-mimi-cabell-jason-huff/" target="_blank">Erreur d’impression</a> in <a title="Jeu de Paume" href="https://jeudepaume.org/en/" target="_blank">Jeu de Paume’s online exhibition space</a> curated by <a title="Alessandro Ludovico" href="http://www.neural.it/" target="_blank">Alessandro Ludovico</a> – October 23, 2012 to March 2014.
- date: '2010-08-01'
  type: Published
  body: <a href="https://jason-huff.com/projects/autosummarize/" title="AutoSummarize">AutoSummarize</a> — Algorithmic summaries of the top 100 most downloaded copyright-free books from Project Gutenberg, each reduced to 10 sentences using Microsoft Word's AutoSummarize function. Featured in <a href="https://www.newyorker.com/books/page-turner/rise-of-the-literature-machines">The New Yorker</a> and <a href="https://therumpus.net/2010/08/02/autosummarize-applied-to-popular-works/">The Rumpus</a>.
