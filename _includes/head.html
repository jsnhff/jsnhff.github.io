<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% if page.title %}Jason Huff - {{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta name="viewport" content="width=device-width">
    <meta name="description" content="{{ site.description }}">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <!-- Open Graph / social sharing -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{ site.title }}">
    <meta property="og:title" content="{% if page.title %}Jason Huff - {{ page.title }}{% else %}{{ site.title }}{% endif %}">
    <meta property="og:description" content="{{ site.description }}">
    <meta property="og:url" content="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:creator" content="@{{ site.twitter_username }}">

    {% if page.url == "/" %}
    <!-- Structured data so search engines and AI crawlers can parse who I am and what I've made -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Jason Huff",
      "url": "{{ site.url }}",
      "jobTitle": "Design Director",
      "description": "{{ site.description }}",
      "sameAs": [
        "https://twitter.com/{{ site.twitter_username }}",
        "https://github.com/{{ site.github_username }}"
      ],
      "hasCreativeWork": [
        {
          "@type": "CreativeWork",
          "name": "How to make a website for your creative work",
          "datePublished": "2019",
          "publisher": { "@type": "Organization", "name": "The Creative Independent" },
          "url": "https://thecreativeindependent.com/guides/how-to-make-a-website-for-your-creative-work/",
          "description": "A guide to getting your work on the internet so you can share it with others."
        },
        {
          "@type": "Book",
          "name": "American Psycho",
          "datePublished": "2010",
          "url": "http://p-dpa.net/work/american-psycho/",
          "description": "An appropriated copy of the Bret Easton Ellis novel, transformed into a series of emails and relational ads, then reformatted back into a book. Created with Mimi Cabell."
        },
        {
          "@type": "Book",
          "name": "AutoSummarize",
          "datePublished": "2010",
          "url": "http://p-dpa.net/work/autosummarize/",
          "description": "A publication cataloguing algorithmically generated summaries of the top 100 most-downloaded copyright-free books."
        }
      ]
    }
    </script>
    {% endif %}

    <!-- Google Analytics -->
    <meta name="google-site-verification" content="_rNdIVPRw7f3ibcOc5yoS2fzX58e262KYE00r4o1wbM" />

    <!-- favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#00aba9">
    <meta name="theme-color" content="#ffffff">

    <!-- 404 page redirect -->
    {% if page.url == "/404.html" %}
        <meta http-equiv="refresh" content="5; url=/">
    {% endif %}

    <!-- CSS -->
    <link rel="stylesheet" href="{{ "/css/normalize.css" | prepend: site.baseurl }}">
    <link rel="stylesheet" href="{{ "/css/basscss.min.css" | prepend: site.baseurl }}">
    <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">


    <!-- Background shader. `background_shader` in _config.yml sets it site-wide;
         `bg:` / `grain:` in a page's front matter override it for that page. -->
    {% assign bg = page.bg | default: site.background_shader %}
    {% assign bg_grain = page.grain | default: site.background_grain | default: 1 %}
    {% if bg %}
    <script src="{{ "/js/bg-shader.js" | prepend: site.baseurl }}" data-variant="{{ bg }}" data-grain="{{ bg_grain }}" defer></script>
    {% endif %}
</head>
