# Site settings
title: Jason Huff
email: jsnhff@gmail.com
description: "Jason Huff is an LA-based design director and web worker on a mission to support artists."
baseurl: "" # the subpath of your site, e.g. /blog/
url: "https://jason-huff.com" # the base hostname & protocol for your site
twitter_username: jsnhff
github_username:  jsnhff

# Background texture (js/bg-shader.js). Options: darkroom, nightfield, gallery.
# Comment out background_shader to fall back to the tiled noise PNG.
# Non-breaking spaces are binds, not typos: they hold a phrase together so
# the statement never deals one across two lines.
home_statement: "Jason Huff is a design director and artist based in Los Angeles. He creates work that investigates the cultural impact of technology and leads teams building products for entrepreneurs."

background_shader: nightfield
background_grain: 0.5

# Build settings
markdown: kramdown
future: true

# Collections
collections:
    projects:
        output: true
        permalink: /projects/:title/
    updates:
        output: true

# Handling Reading
include:      ['_pages']
encoding:     "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Permalinks for blog posts
permalink: /writing/:title/

# This will require each of these plugins automatically.
plugins:
- jekyll-sitemap
- jekyll-redirect-from

# Front matter set on a layout is only visible as `layout.*`, never `page.*`,
# so anything the shell reads off the page (ground colour, which nav item is
# lit) has to be declared here instead.
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      dark: true
      section: "info"
  - scope:
      path: ""
      type: "projects"
    values:
      dark: true
      section: "studio"
