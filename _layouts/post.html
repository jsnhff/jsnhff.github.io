---
layout: site
---
{%- comment -%}
  An essay. Writing is gathered on Info, so that is what stays lit in the bar
  while you are reading one.
{%- endcomment -%}
<article class="col is-prose">
  <p class="row row-meta">{{ page.date | date: "%B %-d, %Y" }}</p>
  <h1 class="row m-h2 post-title">{{ page.title }}</h1>
  {% if page.note %}<p class="row w-meta post-note">{{ page.note }}</p>{% endif %}
  <div class="post-body">
    {{ content }}
  </div>
</article>
